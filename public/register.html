<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — Anonimo</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="brand">Anon<span>imo</span></a>
      <div class="nav-links"><a href="/login.html" class="btn btn-ghost">Masuk</a></div>
    </div>
  </nav>

  <main class="auth-wrapper">
    <form class="glass auth-card" id="register-form" novalidate>
      <h2>Buat Akun</h2>
      <p class="sub">Gratis, dan cuma butuh waktu kurang dari semenit.</p>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="huruf-kecil_dan_angka" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="displayName">Nama Tampilan</label>
        <input type="text" id="displayName" placeholder="Nama kamu" autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="kamu@email.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 8 karakter" autocomplete="new-password" required />
      </div>

      <div class="form-error" id="form-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Daftar</button>

      <p class="form-footer-link">Sudah punya akun? <a href="/login.html">Masuk di sini</a></p>
    </form>
  </main>

  <footer>Copyright &copy; 2026 ApisAjh All rights reserved.</footer>

  <script src="/js/app.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const username = document.getElementById('username').value.trim().toLowerCase();
      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        errorEl.textContent = 'Username harus 3-20 karakter: huruf kecil, angka, underscore.';
        return;
      }
      if (password.length < 8) {
        errorEl.textContent = 'Password minimal 8 karakter.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      const { ok, data } = await apiFetch('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ username, displayName, email, password })
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Daftar';

      if (!ok) {
        errorEl.textContent = data.error || 'Registrasi gagal, coba lagi.';
        return;
      }

      showToast('Registrasi berhasil! Cek email untuk verifikasi.', 'success');
      setTimeout(() => { window.location.href = '/login.html'; }, 1500);
    });
  </script>
</body>
</html>
