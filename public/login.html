<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Anonimo</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="brand">Anon<span>imo</span></a>
      <div class="nav-links"><a href="/register.html" class="btn btn-primary">Daftar</a></div>
    </div>
  </nav>

  <main class="auth-wrapper">
    <form class="glass auth-card" id="login-form" novalidate>
      <h2>Selamat Datang Kembali</h2>
      <p class="sub">Masuk untuk melihat inbox pesan anonimmu.</p>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="kamu@email.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      </div>

      <div class="form-error" id="form-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Masuk</button>

      <p class="form-footer-link">
        <a href="/forgot-password">Lupa password?</a> ·
        Belum punya akun? <a href="/register.html">Daftar</a>
      </p>
    </form>
  </main>

  <footer>Copyright &copy; 2026 ApisAjh All rights reserved.</footer>

  <script src="/js/app.js"></script>
  <script>
    // Sudah login? Langsung ke dashboard (atau ?next=)
    redirectIfLoggedIn();

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      // Normalisasi email + buang sesi lama agar Authorization Bearer usang
      // tidak ikut terkirim dan mengganggu alur login
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      clearSession();

      if (!email || !password) {
        errorEl.textContent = 'Email dan password wajib diisi.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        const { ok, data } = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (!ok) {
          errorEl.textContent = data.error || 'Login gagal, coba lagi.';
          return;
        }

        if (!data.session?.access_token) {
          errorEl.textContent = 'Sesi tidak diterima dari server. Coba lagi atau verifikasi email dulu.';
          return;
        }

        setSession(data.session);
        showToast('Berhasil masuk!', 'success');
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        const dest = next && next.startsWith('/') && !next.startsWith('//') ? next : '/dashboard.html';
        setTimeout(() => { window.location.href = dest; }, 800);
      } catch (err) {
        errorEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
